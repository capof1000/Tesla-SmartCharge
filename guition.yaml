#first version with Guition touchscreen , no boot loop, but bad color.
substitutions:
  device_name: "tesla-touchscreen-simplified"
  friendly_name: "Tesla Touchscreen Simplified"

############################
# ESPHome
############################
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

############################
# ESP32-S3 + PSRAM
############################
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 8192
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

############################
# Logger
############################
logger:
  level: INFO
  logs:
    lvgl: WARN

############################
# API / OTA / WIFI
############################
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 2
  log: false

############################
# SPI (ST7701S)
############################
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

############################
# I2C (GT911)
############################
i2c:
  - id: bus_a
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    frequency: 100kHz

############################
# TOUCHSCREEN
############################
touchscreen:
  platform: gt911
  id: touchscreen_id
  display: main_display
  transform:
    mirror_x: false
    mirror_y: false
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: display_backlight

############################
# DISPLAY ST7701S RGB 480x480
############################
display:
  - platform: st7701s
    id: main_display
    update_interval: never
    auto_clear_enabled: false
    data_rate: 2MHz
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: false
    data_pins:
      red:   [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue:  [4, 5, 6, 7, 15]

############################
# BACKLIGHT
############################
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 100Hz

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_turn_off:
      - lvgl.pause:

############################
# IMAGE (optionnelle)
############################
image:
  - file: "images/charger_unplugged.jpg"
    id: img_unplugged
    type: RGB565

############################
# LVGL
############################
lvgl:
  id: lvgl_component
  color_depth: 16
  buffer_size: 25%
  log_level: WARN
  displays: main_display
  touchscreens:
    - touchscreen_id: touchscreen_id

  pages:
    - id: main_page
      widgets:
        - image:
            id: background_image
            src: img_unplugged
            align: CENTER

        - arc:
            id: charge_level_arc
            align: CENTER
            width: 300
            height: 300
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 210
            end_angle: 330
            arc_width: 10
            arc_color: 0xE6E6E6
            bg_opa: TRANSP
            indicator:
              line_width: 10

        - label:
            id: charge_level_label
            align: CENTER
            y: 140
            text: "-- %"
            text_color: 0x000000

        - label:
            id: status_label
            align: TOP_MID
            y: 20
            text: "BOOTING..."
            text_color: 0xC94A4A

############################
# DEMO UI UPDATE (SAFE)
############################
interval:
  - interval: 2s
    then:
      - lambda: |-
          static int v = 0;
          v = (v + 5) % 101;
          lv_arc_set_value(id(charge_level_arc), v);

          char buf[16];
          snprintf(buf, sizeof(buf), "%d %%", v);
          lv_label_set_text(id(charge_level_label), buf);

          lv_label_set_text(id(status_label), "LVGL OK");
