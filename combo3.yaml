substitutions:
  friendly_name: Combo
  device_name: "tesla-combo"
  device_description: Tesla Combo
  charging_amps_max: "32"

############################
# ESP32
############################
esp32:
  board: esp32dev
  framework:
    type: esp-idf

############################
# CORE
############################
logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  version: 2
  log: false

############################
# TESLA BLE (OFFICIEL)
############################
external_components:
  source: github://PedroKTFC/esphome-tesla-ble

packages:
  base: github://PedroKTFC/esphome-tesla-ble/packages/base.yml
  common: github://PedroKTFC/esphome-tesla-ble/packages/common.yml
  project: github://PedroKTFC/esphome-tesla-ble/packages/project.yml
  client: github://PedroKTFC/esphome-tesla-ble/packages/client.yml

############################
# ESPHOME
############################
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  libraries:
    - TeslaBLE=https://github.com/PedroKTFC/tesla-ble.git
  on_boot:
    priority: 600
    then:
      - script.execute: update_charger_image

############################
# SPI
############################
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

############################
# DISPLAY
############################
display:
  - platform: ili9xxx
    id: my_display
    model: ili9341
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    dimensions:
      width: 320
      height: 240
    invert_colors: false
    auto_clear_enabled: false

############################
# IMAGE
############################
image:
  - file: "images/charger_unplugged.jpg"
    id: img_unplugged
    type: RGB565

############################
# LVGL
############################
lvgl:
  displays: my_display
  buffer_size: 10%
  log_level: WARN

  pages:
    - id: main_page
      widgets:
        - image:
            id: charger_status_image
            src: img_unplugged
            align: CENTER

        - label:
            id: ble_status_label
            text: "BLE not connected"
            align: CENTER
            text_color: 0xFF0000
            hidden: true

############################
# INTERVAL
############################
interval:
  - interval: 2s
    then:
      - script.execute: update_charger_image

############################
# SCRIPT (BLE STATUS)
############################
script:
  - id: update_charger_image
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *img = id(charger_status_image);
          lv_obj_t *lbl = id(ble_status_label);

          lv_img_set_src(img, id(img_unplugged));

          if (id(sw_ble_connection).state) {
            // BLE CONNECTED
            lv_obj_set_style_opa(img, 255, LV_PART_MAIN);
            lv_obj_add_flag(lbl, LV_OBJ_FLAG_HIDDEN);
          } else {
            // BLE DISCONNECTED
            lv_obj_set_style_opa(img, 77, LV_PART_MAIN);
            lv_obj_clear_flag(lbl, LV_OBJ_FLAG_HIDDEN);
          }
