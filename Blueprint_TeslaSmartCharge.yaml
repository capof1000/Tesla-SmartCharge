blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.4
  description: Optimise la charge selon les panneaux solaires et le mode choisi
  domain: automation

  input:

    tesla_switch:
      name: Switch de charge Tesla
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge (A)
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Pourcentage batterie Tesla (%)
      default: sensor.tesla_charge_level
      selector:
        entity:
          domain: sensor
          device_class: battery

    net_consumption:
      name: Consommation nette du foyer (W)
      selector:
        entity:
          domain: sensor
          device_class: power

    tesla_min_power:
      name: Puissance Tesla à 5A (W)
      default: 1100
      selector:
        number:
          min: 500
          max: 3000
          unit_of_measurement: "W"

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: "W"

    delay_off:
      name: Temps minimum ON avant OFF (s)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: "s"

    charge_mode:
      name: Mode de charge Tesla
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

mode: restart

trigger:
  - platform: state
    entity_id: !input net_consumption

  - platform: state
    entity_id: !input tesla_switch

  - platform: time_pattern
    minutes: "/5"

variables:
  switch_id: !input tesla_switch
  amp_entity: !input tesla_amperage
  net_entity: !input net_consumption
  soc_entity: !input tesla_soc
  charge_mode_entity: !input charge_mode

  min_power: !input tesla_min_power
  max_house: !input max_house_power
  delay_off: !input delay_off

  mode: "{{ states(charge_mode_entity) }}"
  net: "{{ states(net_entity) | float(0) }}"
  soc: "{{ states(soc_entity) | float(0) }}"
  available_power: "{{ 0 - net }}"
  computed_amps: >
    {{ [32, [5, (available_power / (min_power / 5)) | int] | max] | min }}

action:
  # ================================
  # BLINDAGE MODE MANUEL
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manuel' }}"
        sequence:
          - service: logbook.log
            data:
              name: "Optimisation Charge Tesla"
              message: "Mode manuel actif – aucune automatisation appliquée."
  - choose:

      ###############################################
      # MODE RADIN
      ###############################################
      - conditions:
          - condition: template
            value_template: "{{ mode == 'radin' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ net <= (min_power * -1) }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 5
            else:
              - delay:
                  seconds: "{{ delay_off | int }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE SMART SOLAIRE
      ###############################################
      - conditions:
          - condition: template
            value_template: "{{ mode == 'smart_solaire' }}"
        sequence:
          - variables:
              smart_threshold: "{{ (min_power * (soc / 100)) * -1 }}"
          - if:
              - condition: template
                value_template: "{{ net <= smart_threshold }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - if:
                  - condition: template
                    value_template: "{{ computed_amps >= 5 }}"
                then:
                  - service: number.set_value
                    target:
                      entity_id: "{{ amp_entity }}"
                    data:
                      value: "{{ computed_amps | int }}"
            else:
              - delay:
                  seconds: "{{ delay_off | int }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE FORCE
      ###############################################
      - conditions:
          - condition: template
            value_template: "{{ mode == 'force' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ (net * -1) + min_power <= max_house }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 32
            else:
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"
