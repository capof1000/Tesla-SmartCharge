blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.2.1
  description: |
    Blueprint prevu pour fonctionner avec mon integration tesla BLE (guition)
    Clean up some variables.
    Add door 0, if absence is detected, no action.
    0.1.1 Time in message/log
    0.1.2 mode single
    0.1.3 bug cut instead of decreasing in smart - FIXED
    0.1.4 Reorganize smart logic: start → increase → decrease → stop (only at min)
    0.1.5 Add shortcut in force mode to max power
    0.1.6 Replace presence (BLE status) by charge cable sensor (binary_sensor.tesla_charge_flap)
    0.1.7 Update mode values to english (manual/solar/forced) for b28 multi-language support
    0.1.8 Fix tesla_current_amperage and tesla_voltage selectors : domain number → sensor
    0.1.9 Cosmetic: rename offset_start → solar_min_power, improve input name and description
    0.2.0 Solar mode: shift regulation band by -1A to preserve battery storage
    0.2.1 Solar mode: add tolerance input (default 10%) to widen dead zone and prevent elastic effect with home battery

  domain: automation

  input:
    net_consumption:
      name: Consommation nette du foyer (W)
      description: Entite qui va proposer le bilan net electrique du foyer, positif lors que l'on consomme de l'énergie, il devient negatif lorsque l'on sur-produit de l'éenergie et que l'on la renvoit sur le réseau.
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor

    tesla_switch:
      name: Switch charge Tesla
      description: Switch permettant d'allumer ou eteindre la charge de la voiture. (fourni par Tesla BLE)
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Consigne de puissance
      description: Intensite en Ampère (fourni par Tesla BLE), il s'agit de la consigne de re charge. Peut-etre inferieur a l'amperage de charge réel.
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_current_amperage:
      name: Intensité de charge Tesla
      description: Intensite en Ampère (fourni par Tesla BLE), il s'agit des amperes effectivement consommées lors ce que la charge est en cours.
      default: sensor.tesla_charge_current
      selector:
        entity:
          domain: sensor   # b1.8 - fix : était "number", charge_current est un sensor chez Pedro

    tesla_voltage:
      name: Voltage de charge Tesla
      description: voltage pendant la charge (fourni par Tesla BLE).
      default: sensor.tesla_charge_voltage
      selector:
        entity:
          domain: sensor   # b1.8 - fix : était "number", charge_voltage est un sensor chez Pedro

    charge_cable:
      name: Câble de charge branché
      description: Capteur indiquant si le câble de charge est branché à la voiture. Aucune action ne sera effectuée si le câble n'est pas connecté.
      default: binary_sensor.tesla_charge_flap
      selector:
        entity:
          domain: binary_sensor

    amp_min:
      name: Intensite de charge mini
      description: Intensite de charge minimal admissible, l'application Officielle ne permet pas de descendre sous 5A, on peut descendre legerement en dessous.
      default: 5
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"

    amp_max:
      name: Intensite de charge max
      description: Intensite de charge maximale admissible, l'application Officielle limite la charge a 16A sur une prise standard, 32A sur une P17. Conserver ces reglages est largement recommande !
      default: 32
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"

    tesla_soc:
      name: Niveau de charge Tesla (SOC)
      default: sensor.tesla_charge_level
      description: Il s'agit du pourcentage de charge de la batterie (fourni par Tesla BLE).
      selector:
        entity:
          domain: sensor

    charge_mode:
      name: Mode de charge Tesla
      description: >
        Selecteur de mode de charge (fourni par MA version de Tesla BLE/guition).
        Valeurs attendues (en anglais depuis b28) : manual, solar, forced.
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

    max_house_power:
      name: Puissance max du foyer (W)
      description: En mode forcé, il s'agit ici d'une consigne de consommation maximale a ne pas depasser, afin d'eviter de disjoncter lorsque d'autre gros consommateur sont en fonction (couplage AC). donc a adapter en fonction de votre abonnement Enedis. Par exemple une approximation, 12KVA -> 12000.
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: W

    solar_min_power:
      name: Puissance minimale de démarrage (W)
      description: >
        En mode solaire, seuil de surproduction nécessaire pour démarrer la charge.
        Entrez une valeur négative : par exemple -1200 pour démarrer lorsque la surproduction
        atteint 1200W (la consommation nette doit être inférieure à cette valeur).
        Cette valeur doit etre en lien avec l'intensite de charge mini.
      default: -1100
      selector:
        number:
          min: -3000
          max: 3000
          step: 1
          unit_of_measurement: "W"

    solar_tolerance:
      name: Tolérance de régulation solaire (%)
      description: >
        En mode solaire, pourcentage de tolérance appliqué autour des seuils de régulation
        afin d'élargir la zone morte et d'éviter les oscillations. À 10%, les seuils s'écartent de 10% dans chaque direction.
        Augmenter cette valeur si l'effet élastique persiste.
      default: 10
      selector:
        number:
          min: 0
          max: 50
          step: 1
          unit_of_measurement: "%"

    delay_tempo:
      name: Temporisation régulation
      description: il s'agit du delay de temporisatin avant d'effectuer cetaines actions. ce delais est necessaire pour que l'effet d'une action soit refletee sur la mesure de consommation generale.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: "s"

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input net_consumption
  - platform: state
    entity_id: !input tesla_switch
  - platform: state
    entity_id: !input tesla_amperage
  - platform: state
    entity_id: !input tesla_current_amperage
  - platform: state
    entity_id: !input tesla_voltage
  - platform: state
    entity_id: !input charge_cable
  - platform: state
    entity_id: !input tesla_soc
  - platform: state
    entity_id: !input charge_mode
  - platform: time_pattern
    minutes: "/5"

variables:
  net_entity: !input net_consumption
  net: "{{ states(net_entity) | float(0) }}"
  switch_entity: !input tesla_switch
  amp_entity: !input tesla_amperage
  soc_entity: !input tesla_soc
  soc: "{{ states(soc_entity) | float(0) }}"
  mode_entity: !input charge_mode
  mode: "{{ states(mode_entity) | default('manual') }}"
  min_allowed: !input amp_min
  max_allowed: !input amp_max
  tesla_voltage_charge: !input tesla_voltage
  current_voltage: "{{ states(tesla_voltage_charge) | int(220) if 150 < states(tesla_voltage_charge) | int(220) < 260 else 220 }}"
  tesla_current_charge: !input tesla_current_amperage
  current_charge: "{{ states(tesla_current_charge) | float(0) }}"
  delay_tempo_value: !input delay_tempo
  offset: !input solar_min_power
  tolerance_pct: !input solar_tolerance
  tesla_charge_cable: !input charge_cable
  max_house: !input max_house_power
  # Seuils calculés avec tolérance
  threshold_increase: "{{ current_voltage * (2 + tolerance_pct / 100) }}"
  threshold_decrease: "{{ -(current_voltage * (1 - tolerance_pct / 100)) }}"

action:

  - choose:
      # --- PORTE 1 : CÂBLE NON BRANCHÉ ---
      - conditions:
          - condition: template
            value_template: "{{ states(tesla_charge_cable) != 'on' }}"
        sequence:
          - stop: "Câble de charge non branché – aucune action."

      # --- PORTE 2 : MODE MANUEL ---
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manual' }}"
        sequence:
          - stop: "Mode manuel actif – aucune automatisation"

      # --- PORTE 3 : MODE SMART SOLAIRE ---
      - conditions:
          - condition: template
            value_template: "{{ mode == 'solar' }}"
        sequence:
          - service: system_log.write
            data:
              message: >
                [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] Variables - Mode: {{ mode }}, Net: {{ net }}W, Offset: {{ offset }}W,
                Voltage: {{ current_voltage }}V, Charge actuelle: {{ current_charge }}A,
                Amperage consigne: {{ states(amp_entity) }}A, Switch: {{ states(switch_entity) }},
                Tolérance: {{ tolerance_pct }}%, Seuil ⬆️: {{ threshold_increase | round(0) }}W, Seuil ⬇️: {{ threshold_decrease | round(0) }}W
              level: info

          - choose:
              # 1. DÉMARRAGE
              - conditions:
                  - condition: template
                    value_template: "{{ net < offset }}"
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "off"
                sequence:
                  - service: system_log.write
                    data:
                      message: >
                        [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ✅ DÉMARRAGE - Net ({{ net }}W) < Offset ({{ offset }}W)
                        - Attente {{ delay_tempo_value }}s avant démarrage
                      level: warning
                  - delay:
                      seconds: "{{ delay_tempo_value }}"
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: system_log.write
                    data:
                      message: "[{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ✅ Charge démarrée"
                      level: warning

              # 2. AUGMENTATION
              # Seuil : surplus > V × (2 + tol%) — ex. 10% → 525W@250V
              - conditions:
                  - condition: template
                    value_template: "{{ -(net) > threshold_increase }}"
                  - condition: template
                    value_template: "{{ states(amp_entity) | int < max_allowed }}"
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "on"
                sequence:
                  - service: system_log.write
                    data:
                      message: >
                        [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⬆️ AUGMENTATION - Surplus ({{ -(net) }}W) > Seuil ({{ threshold_increase | round(0) }}W)
                        - {{ states(amp_entity) }}A → {{ [(states(amp_entity) | int) + 1, max_allowed] | min }}A - Attente {{ delay_tempo_value }}s
                      level: warning
                  - delay:
                      seconds: "{{ delay_tempo_value }}"
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: "{{ [(states(amp_entity) | int) + 1, max_allowed] | min }}"
                  - service: system_log.write
                    data:
                      message: "[{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⬆️ Amperage augmenté à {{ [(states(amp_entity) | int) + 1, max_allowed] | min }}A"
                      level: warning

              # 3. DIMINUTION
              # Seuil : net > -(V × (1 - tol%)) — ex. 10% → -225W@250V
              - conditions:
                  - condition: template
                    value_template: "{{ net > threshold_decrease }}"
                  - condition: template
                    value_template: "{{ states(amp_entity) | int > min_allowed }}"
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "on"
                sequence:
                  - service: system_log.write
                    data:
                      message: >
                        [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⬇️ DIMINUTION - Net ({{ net }}W) > Seuil ({{ threshold_decrease | round(0) }}W)
                        - {{ states(amp_entity) }}A → {{ [(states(amp_entity) | int) - 1, min_allowed] | max }}A - Attente {{ delay_tempo_value }}s
                      level: warning
                  - delay:
                      seconds: "{{ delay_tempo_value }}"
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: "{{ [(states(amp_entity) | int) - 1, min_allowed] | max }}"
                  - service: system_log.write
                    data:
                      message: "[{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⬇️ Amperage diminué à {{ [(states(amp_entity) | int) - 1, min_allowed] | max }}A"
                      level: warning

              # 4. ARRÊT
              - conditions:
                  - condition: template
                    value_template: "{{ net > ((current_charge * current_voltage) + offset) }}"
                  - condition: template
                    value_template: "{{ states(amp_entity) | int <= min_allowed }}"
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "on"
                sequence:
                  - service: system_log.write
                    data:
                      message: >
                        [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⛔ ARRÊT - Net ({{ net }}W) > Seuil ({{ (current_charge * current_voltage) + offset }}W)
                        ET Amperage au minimum ({{ states(amp_entity) }}A) - Attente {{ delay_tempo_value }}s
                      level: warning
                  - delay:
                      seconds: "{{ delay_tempo_value }}"
                  - service: switch.turn_off
                    target:
                      entity_id: !input tesla_switch
                  - service: system_log.write
                    data:
                      message: "[{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⛔ Charge arrêtée (était au minimum)"
                      level: warning
            default:
              - service: system_log.write
                data:
                  message: >
                    [{{ now().strftime('%H:%M:%S') }}] [Tesla Smart] ⏸️ AUCUNE ACTION - État actuel:
                    - Net: {{ net }}W (Offset: {{ offset }}W)
                    - Switch: {{ states(switch_entity) }}
                    - Amperage consigne: {{ states(amp_entity) }}A (Min: {{ min_allowed }}A, Max: {{ max_allowed }}A)
                    - Amperage réel: {{ current_charge }}A
                    - Voltage: {{ current_voltage }}V
                    - Puissance Tesla: {{ (current_charge * current_voltage) | round(0) }}W
                    - Surplus disponible: {{ -(net) }}W
                    - Seuil arrêt: {{ (current_charge * current_voltage) + offset }}W
                    - Zone morte: {{ threshold_decrease | round(0) }}W … {{ -(threshold_increase | round(0)) }}W (tol. {{ tolerance_pct }}%)
                    - SOC: {{ soc }}%
                  level: info

      # --- PORTE 4 : MODE FORCE ---
      - conditions:
          - condition: template
            value_template: "{{ mode == 'forced' }}"
        sequence:
          - if:
              - condition: state
                entity_id: !input tesla_switch
                state: "off"
            then:
              - service: switch.turn_on
                target:
                  entity_id: !input tesla_switch

          - delay:
              seconds: "{{ delay_tempo_value }}"

          - service: number.set_value
            target:
              entity_id: !input tesla_amperage
            data:
              value: >-
                {% set current_amp = states(amp_entity) | int(5) %}
                {% set min_amp = min_allowed | int %}
                {% set max_amp = max_allowed | int %}

                {% if net > max_house and current_amp > min_amp %}
                  {{ [current_amp - 1, min_amp] | max }}

                {% elif (max_house - net) > (current_voltage * max_amp) and current_amp == min_amp %}
                  {{ max_amp }}

                {% elif net < max_house and current_amp < max_amp %}
                  {{ [current_amp + 1, max_amp] | min }}

                {% else %}
                  {{ current_amp }}
                {% endif %}
