blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.8
  description: |
    Blueprint prevu pour fonctionner avec mon integration tesla BLE (guition)
    Clean up some variables.
    Add door 0, if absence is detected, no action.
  domain: automation

  input:
    net_consumption:
      name: Consommation nette du foyer (W)
      description: Entite qui va proposer le bilan net electrique du foyer, positif lors que l'on consomme de l'énergie, il devient negatif lorsque l'on sur-produit de l'éenergie et que l'on la renvoit sur le réseau.
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor

    tesla_switch:
      name: Switch charge Tesla
      description: Switch permettant d'allumer ou eteindre la charge de la voiture. (fourni par Tesla BLE)
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Consigne de puissance
      description: Intensite en Ampère (fourni par Tesla BLE), il s'agit de la consigne de re charge. Peut-etre inferieur a l'amperage de charge réel.
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_current_amperage:
      name: Intensité de charge Tesla
      description: Intensite en Ampère (fourni par Tesla BLE), il s'agit des amperes effectivement consommées lors ce que la charge est en cours.
      default: sensor.tesla_charge_current
      selector:
        entity:
          domain: number

    tesla_voltage:
      name: Voltage de charge Tesla
      description: voltage pendant la charge (fourni par Tesla BLE).
      default: sensor.tesla_charge_voltage
      selector:
        entity:
          domain: number
          #unit_of_measurement: "V"

    presence:
      name: Presence Tesla
      description: On utilise le status de connection bluetooth de la gateway afin deduire si l'auto est presente (ou pas). En cas d'absence, aucune conigne de pouvant aboutir, nous resterons muet.
      default: binary_sensor.tesla_ble_status
      selector:
        entity:
          domain: binary_sensor
          
    amp_min:
      name: Intensite de charge mini
      description: Intensite de charge minimal admissible, l'application Officielle ne permet pas de descendre sous 5A, on peut descendre legerement en dessous.
      default: 5
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"
      
    amp_max:
        name: Intensite de charge max
        description: Intensite de charge maximale admissible, l'application Officielle limite la charge a 16A sur une prise standard, 32A sur une P17. Conserver ces reglages est largement recommande !
        default: 32
        selector:
          number:
            min: 5
            max: 32
            unit_of_measurement: "A"

    tesla_soc:
      name: Niveau de charge Tesla (SOC)
      default: sensor.tesla_charge_level
      description: Il s'agit du pourcentage de charge de la batterie (fourni par Tesla BLE).
      selector:
        entity:
          domain: sensor

    charge_mode:
      name: Mode de charge Tesla
      description: il s'agit d'un selecteur afin de choisir le mode de charge. (fourni par MA version de Tesla BLE/guition) :Manuel, Force ou smart_solaire.
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

    max_house_power:
      name: Puissance max du foyer (W)
      description: IL s'agit ici d'une consigne de consommation maximale a ne pas depasse en mode force, afin d'eviter de disjoncter lorsque d'autre gros consommateur sont en fonction (couplage AC). donc a adapter en fonction de votre abonnement Enedis. Par exemple une approximation, 12KVA -> 12000.
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: W

    offset_start:
      name: Offset à l'allumage (W)
      description: La Consomation nette doit etre inferieure a cette à cette valeur pour allumer l'équipement (valeur négative).Entrez, -1200 pour demarrer l'appareil lorsque la surproduction atteint 1200W.
      default: -50
      selector:
        number:
          min: -3000
          max: 3000
          step: 1
          unit_of_measurement: "W"
    
    delay_tempo:
      name: Temporisation régulation mode force
      description: il s'agit du delay de temporisatin avant d'effectuer cetaines actions.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: "s"

mode: restart

trigger:
  - platform: state
    entity_id: !input net_consumption
  - platform: state
    entity_id: !input tesla_switch
  - platform: state
    entity_id: !input charge_mode
  - platform: time_pattern
    minutes: "/5"

variables:
  net_entity: !input net_consumption
  net: "{{ states(net_entity) | float(0) }}"
  #net: "{{ states(!input net_consumption) | float(0) }}"
  switch_entity: !input tesla_switch
  amp_entity: !input tesla_amperage
  soc_entity: !input tesla_soc
  soc: "{{ states(soc_entity) | float(0) }}"
  #soc: "{{ states(!input tesla_soc) | float(0) }}"
  mode_entity: !input charge_mode
  #mode: "{{ states(mode_entity) | string }}"
  mode: "{{ states(mode_entity) | default('manuel') }}"
  #mode: "{{ states(!input charge_mode) | default('manuel') }}"
  min_allowed: !input amp_min
  max_allowed: !input amp_max
  tesla_voltage_charge: !input tesla_voltage
  current_voltage: "{{ states(tesla_voltage_charge) | int(220) if 150 < states(tesla_voltage_charge) | int(220) < 260 else 220 }}"
  tesla_current_charge: !input tesla_current_amperage
  current_charge: "{{ states(tesla_current_charge) | float(0) }}"
  #current_charge: "{{ states(!input tesla_current_amperage) | float(0) }}"
  delay_tempo_value: !input delay_tempo
  offset: !input offset_start
  tesla_presence: !input presence
  

  #min_power: 1100
  max_house: !input max_house_power

  #available_power: "{{ -net }}"

  #computed_amps: >-
  #  {% set watts = available_power %}
  #  {% set amp = watts / (min_power / 5) %}
  #  {% if amp < 5 %}
  #    0
  #  {% elif amp > 32 %}
  #    32
  #  {% else %}
  #    {{ amp | round(0) }}
  #  {% endif %}

  #current_voltage: >-
  #  {% set volts = states(tesla_voltage_charge) | int(220) %}
  #  {% if 150 < volts < 260 %}
  #    {{ volts }}
  #  {% else %}
  #    220
  #  {% endif %}

 
  #current_voltage: "{{ states(!input tesla_voltage) | int(220) if 150 < states(!input tesla_voltage) | int(220) < 260 else 220 }}"
 
  

  #smart_threshold: "{{ -(min_power * (soc / 100)) }}"

action:
  # --- PORTE 1 : ABSENCE ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(tesla_presence) != 'on' }}"
        sequence:
          - stop: "Tesla absente ou Bluetooth déconnecté."

  # --- PORTE 2 : MODE MANUEL
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manuel' }}"
        sequence:
          - stop: "Mode manuel actif – aucune automatisation"

  # --- PORTE 3 : MODE SMART SOLAIRE
  - choose:
    - conditions:
        - condition: template
          value_template: "{{ mode == 'smart_solaire' }}"
      sequence:
        # Debug : afficher les variables au début
        - service: system_log.write
          data:
            message: >
              [Tesla Smart] Variables - Mode: {{ mode }}, Net: {{ net }}W, Offset: {{ offset }}W, 
              Voltage: {{ current_voltage }}V, Charge actuelle: {{ current_charge }}A, 
              Amperage consigne: {{ states(amp_entity) }}A, Switch: {{ states(switch_entity) }}
            level: info
            
        # Gestion du démarrage et arrêt de la charge
        - choose:
            # Start charge si conso nette < offset ET switch OFF
            - conditions:
                - condition: template
                  value_template: "{{ net < offset }}"
                - condition: state
                  entity_id: !input tesla_switch
                  state: "off"
              sequence:
                - service: system_log.write
                  data:
                    message: >
                      [Tesla Smart] ✅ DÉMARRAGE - Net ({{ net }}W) < Offset ({{ offset }}W) 
                      - Attente {{ delay_tempo_value }}s avant démarrage
                    level: warning
                - delay:
                    seconds: "{{ delay_tempo_value }}"
                - service: switch.turn_on
                  target:
                    entity_id: !input tesla_switch
                - service: system_log.write
                  data:
                    message: "[Tesla Smart] ✅ Charge démarrée"
                    level: warning

            
            # Stop la charge si conso nette > conso de la tesla + offset
            - conditions:
                - condition: template
                  value_template: "{{ net > ((current_charge * current_voltage) + offset ) }}"
                - condition: state
                  entity_id: !input tesla_switch
                  state: "on"
              sequence:
                - service: system_log.write
                  data:
                    message: >
                      [Tesla Smart] ⛔ ARRÊT - Net ({{ net }}W) > Conso Tesla ({{ (current_charge * current_voltage) }}W) + Offset ({{ offset }}W) 
                      = Seuil: {{ (current_charge * current_voltage) + offset }}W - Attente {{ delay_tempo_value }}s
                    level: warning
                - delay:
                    seconds: "{{ delay_tempo_value }}"
                - service: switch.turn_off
                  target:
                    entity_id: !input tesla_switch
                - service: system_log.write
                  data:
                    message: "[Tesla Smart] ⛔ Charge arrêtée"
                    level: warning

            # on augmente la charge de 1A
            - conditions:
                - condition: template
                  value_template: "{{ -(net) > (current_voltage) }}"
                - condition: template
                  value_template: "{{ states(amp_entity) | int  < max_allowed }}"
                - condition: state
                  entity_id: !input tesla_switch
                  state: "on"
              sequence:
                - service: system_log.write
                  data:
                    message: >
                      [Tesla Smart] ⬆️ AUGMENTATION - Surplus ({{ -(net) }}W) > Voltage ({{ current_voltage }}W) 
                      - {{ states(amp_entity) }}A → {{ [(states(amp_entity) | int) + 1, max_allowed] | min }}A - Attente {{ delay_tempo_value }}s
                    level: warning
                - delay:
                    seconds: "{{ delay_tempo_value }}"
                - service: number.set_value
                  target:
                    entity_id: !input tesla_amperage
                  data:
                    value: "{{ [(states(amp_entity) | int) + 1, max_allowed] | min }}"
                - service: system_log.write
                  data:
                    message: "[Tesla Smart] ⬆️ Amperage augmenté à {{ [(states(amp_entity) | int) + 1, max_allowed] | min }}A"
                    level: warning

            # on diminue la charge de 1A
            - conditions:
                - condition: template
                  value_template: "{{ (net) > (current_voltage) }}"
                - condition: template
                  value_template: "{{ states(amp_entity) | int > min_allowed }}"
                - condition: state
                  entity_id: !input tesla_switch
                  state: "on"
              sequence:
                - service: system_log.write
                  data:
                    message: >
                      [Tesla Smart] ⬇️ DIMINUTION - Conso réseau ({{ net }}W) > Voltage ({{ current_voltage }}W) 
                      - {{ states(amp_entity) }}A → {{ [(states(amp_entity) | int) - 1, min_allowed] | max }}A - Attente {{ delay_tempo_value }}s
                    level: warning
                - delay:
                    seconds: "{{ delay_tempo_value }}"
                - service: number.set_value
                  target:
                    entity_id: !input tesla_amperage
                  data:
                    value: "{{ [(states(amp_entity) | int) - 1, min_allowed] | max }}"
                - service: system_log.write
                  data:
                    message: "[Tesla Smart] ⬇️ Amperage diminué à {{ [(states(amp_entity) | int) - 1, min_allowed] | max }}A"
                    level: warning
  
  # --- PORTE 4 : MODE FORCE
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'force' }}"
        sequence:
          # 1. Sécurité SOC 100%
          #- if:
          #    - condition: numeric_state
          #      entity_id: !input tesla_soc
          #      above: 99.9
          #  then:
          #    - service: switch.turn_off
          #      target:
          #        entity_id: !input tesla_switch

          # 2. Allumage si nécessaire
          - if:
              - condition: state
                entity_id: !input tesla_switch
                state: "off"
            then:
              - service: switch.turn_on
                target:
                  entity_id: !input tesla_switch

          # 3. Régulation de l'intensité (±1A)
          - delay:
              seconds: "{{ delay_tempo_value }}"

          - service: number.set_value
            target:
              entity_id: !input tesla_amperage
            data:
              value: >-
                {% set current_amp = states(amp_entity) | int(5) %}
                {% set min_amp = min_allowed | int %}
                {% set max_amp = max_allowed | int %}

                {% if net > max_house and current_amp > min_amp %}
                  {{ [current_amp - 1, min_amp] | max }}

               
                {% elif net < max_house and current_amp < max_amp %}
                  {{ [current_amp + 1, max_amp] | min }}

                {% else %}
                  {{ current_amp }}
                {% endif %}

