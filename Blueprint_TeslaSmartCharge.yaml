blueprint:
  name: Optimisation Charge Tesla Photovoltaïque
  description: Optimise la charge selon les panneaux solaires et le mode choisi
  domain: automation

  input:

    tesla_switch:
      name: Switch de charge Tesla
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge (A)
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Pourcentage batterie Tesla (%)
      selector:
        entity:
          domain: sensor
          device_class: battery

    net_consumption:
      name: Consommation nette du foyer (W)
      selector:
        entity:
          domain: sensor
          device_class: power

    tesla_min_power:
      name: Puissance Tesla à 5A (W)
      default: 1100
      selector:
        number:
          min: 500
          max: 3000
          unit_of_measurement: "W"

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: "W"

    delay_off:
      name: Temps minimum ON avant OFF (s)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: "s"

    charge_mode:
      name: Mode de charge
      description: 1=Auto, 2=Radin, 3=Smart, 4=Force
      selector:
        number:
          min: 1
          max: 4
          step: 1

mode: restart

trigger:
  # Surproduction + conditions selon mode
  - platform: state
    entity_id: !input net_consumption

  # Sécurité disjoncteur
  - platform: state
    entity_id: !input tesla_switch

  # Sécurité de recalcul
  - platform: time_pattern
    minutes: "/5"
    id: periodic_check

variables:
  mode: !input charge_mode
  net: "{{ states( (input_net := input.net_consumption) ) | float }}"
  soc: "{{ states( (input_soc := input.tesla_soc) ) | float }}"
  min_power: !input tesla_min_power
  max_house: !input max_house_power
  switch_id: !input tesla_switch
  amp_entity: !input tesla_amperage

  # Calcul intensité max disponible
  available_power: "{{ 0 - net }}"   # surproduction = négatif
  computed_amps: >-
    {% set watts = available_power %}
    {% set amp = (watts / (min_power/5)) | float %}
    {% if amp < 5 %} 0
    {% elif amp > 32 %} 32
    {% else %} {{ amp | round(0) }}
    {% endif %}

action:

  - choose:

      ###############################################
      # MODE 1 — AUTOCONSOMMATION
      ###############################################
      - conditions: "{{ mode == 1 }}"
        sequence:
          - if:
              - "{{ net <= 0 }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - if:
                  - "{{ computed_amps >= 5 }}"
                then:
                  - service: number.set_value
                    target:
                      entity_id: "{{ amp_entity }}"
                    data:
                      value: "{{ computed_amps }}"
            else:
              - delay: "{{ states('!input delay_off') | int }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE 2 — RADIN
      # Charge uniquement si net <= min_power
      ###############################################
      - conditions: "{{ mode == 2 }}"
        sequence:
          - if:
              - "{{ net <= (min_power * -1) }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 5
            else:
              - delay: "{{ states('!input delay_off') | int }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE 3 — SMART
      # Seuil = min_power * soc/100
      ###############################################
      - conditions: "{{ mode == 3 }}"
        sequence:
          - variables:
              smart_threshold: "{{ (min_power * (soc/100)) * -1 }}"
          - if:
              - "{{ net <= smart_threshold }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - if:
                  - "{{ computed_amps >= 5 }}"
                then:
                  - service: number.set_value
                    target:
                      entity_id: "{{ amp_entity }}"
                    data:
                      value: "{{ computed_amps }}"
            else:
              - delay: "{{ states('!input delay_off') | int }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE 4 — CHARGE FORCÉE
      ###############################################
      - conditions: "{{ mode == 4 }}"
        sequence:
          - if:
              - "{{ (net * -1) + min_power <= max_house }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 32
            else:
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"
