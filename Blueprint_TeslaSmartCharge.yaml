blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.3
  description: Optimise la charge selon les panneaux solaires et le mode choisi
  domain: automation

  input:
    tesla_switch:
      name: Switch de charge Tesla
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge (A)
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Pourcentage batterie Tesla (%)
      default: sensor.tesla_charge_level
      selector:
        entity:
          domain: sensor
          device_class: battery

    net_consumption:
      name: Consommation nette du foyer (W)
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor
          device_class: power

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: "W"

    charge_mode:
      name: Mode de charge Tesla
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

mode: restart

variables:
  mode: "{{ states(!input charge_mode) | string }}"
  net: "{{ states(!input net_consumption) | float }}"
  soc: "{{ states(!input tesla_soc) | float }}"
  min_power: 1100
  max_house: !input max_house_power
  available_power: "{{ -net }}"
  computed_amps: >-
    {% set watts = available_power %}
    {% set amp = watts / (min_power / 5) %}
    {% if amp < 5 %}
      0
    {% elif amp > 32 %}
      32
    {% else %}
      {{ amp | round(0) }}
    {% endif %}
  smart_threshold: "{{ -(min_power * (soc / 100)) }}"

triggers:
  - platform: state
    entity_id: !input net_consumption
  - platform: state
    entity_id: !input tesla_switch
  - platform: state
    entity_id: !input charge_mode
  - platform: time_pattern
    minutes: "/5"

actions:

  # ================================
  # MODE MANUEL
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manuel' }}"
        sequence:
          - stop: "Mode manuel actif – aucune automatisation"

  # ================================
  # MODE RADIN
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'radin' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= -min_power }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: 5
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # ================================
  # MODE SMART SOLAIRE
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'smart_solaire' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= smart_threshold and computed_amps >= 5 }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: "{{ computed_amps }}"
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # ================================
  # MODE FORCE
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'force' }}"
        sequence:

          # 1️⃣ SOC = 100% -> arrêter la charge
          - choose:
              - conditions:
                  - condition: numeric_state
                    entity_id: !input tesla_soc
                    above: 99.9
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input tesla_switch

          # 2️⃣ Si voiture éteinte -> juste allumer
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "off"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch

          # 3️⃣ Si voiture déjà en charge -> ajuster intensité
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "on"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: >-
                        {% set current_amp = states(!input tesla_amperage) | int %}
                        {% if net > max_house and soc > 5 %}
                          {{ current_amp - 1 }}
                        {% elif net < max_house and soc < 32 %}
                          {{ current_amp + 1 }}
                        {% else %}
                          {{ current_amp }}
                        {% endif %}
