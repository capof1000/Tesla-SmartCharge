blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.7
  description: Blueprint fidèle à l'automatisation
  domain: automation

  input:
    net_consumption:
      name: Consommation nette du foyer (W)
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor

    tesla_switch:
      name: Switch charge Tesla
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge Tesla
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Niveau de charge Tesla (SOC)
      default: sensor.tesla_charge_level
      selector:
        entity:
          domain: sensor

    charge_mode:
      name: Mode de charge Tesla
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: W    delay:
      name: Temporisation entre ajustements
      description: Evite les variations trop rapides
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: "s"

mode: restart

trigger:
  - platform: time_pattern
    seconds: "/10"

variables:
  current_amp: "{{ states(input.charging_amp_number) | int }}"
  conso: "{{ states(input.conso_nette) | int }}"
  soc: "{{ states(input.soc_batterie) | int }}"
  pmax: "{{ states(input.puissance_max_foyer) | int }}"
  amp_min: "{{ input.amp_min | int }}"
  amp_max: "{{ input.amp_max | int }}"

condition:
  - condition: state
    entity_id: !input mode_force
    state: "on"

action:
  - choose:

      # 🔽 Diminuer l’intensité
      - conditions:
          - condition: template
            value_template: >
              {{ conso > pmax and soc > 5 and current_amp > amp_min }}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input charging_amp_number
            data:
              value: "{{ current_amp - 1 }}"
          - delay:
              seconds: !input delay

      # 🔼 Augmenter l’intensité
      - conditions:
          - condition: template
            value_template: >
              {{ conso < pmax and soc < 32 and current_amp < amp_max }}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input charging_amp_number
            data:
              value: "{{ current_amp + 1 }}"
          - delay:
              seconds: !input delay

    default: []

