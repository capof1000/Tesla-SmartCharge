blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.9
  description: Blueprint fidèle à l'automatisation
  domain: automation

  input:
    net_consumption:
      name: Consommation nette du foyer (W)
      description: Entite qui va proposer le bilan net electrique du foyer, positif lors que l'on consomme de l'énergie, il devient negatif lorsque l'on sur-produit de l'éenergie et que l'on la renvoit sur le réseau.
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor

    tesla_switch:
      name: Switch charge Tesla
      description: Switch permettant d'allumer ou eteindre la charge de la voiture. (fourni par Tesla BLE)
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge Tesla
      description: Intensite en Ampère (fourni par Tesla BLE), il s'agit de la consigne de re charge. Peut-etre inferieur a l'amperage de charge réel.
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    amp_min:
      name: Intensite de charge mini
      description: Intensite de charge minimal admissible, l'application Officielle ne permet pas de descendre sous 5A, on peut descendre legerement en dessous.
      default: 5
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"
      
    amp_max:
        name: Intensite de charge max
        description: Intensite de charge maximale admissible, l'application Officielle limite la charge a 16A sur une prise standard, 32A sur une P17. Conserver ces reglages est largement recommande !
        default: 32
        selector:
          number:
            min: 5
            max: 32
            unit_of_measurement: "A"

    tesla_soc:
      name: Niveau de charge Tesla (SOC)
      default: sensor.tesla_charge_level
      description: Il s'agit du pourcentage de charge de la batterie (fourni par Tesla BLE).
      selector:
        entity:
          domain: sensor

    charge_mode:
      name: Mode de charge Tesla
      description: il s'agit d'un selecteur afin de choisir le mode de charge. (fourni par MA version de Tesla BLE/guition) :Manuel, Force ou smart_solaire.
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

    max_house_power:
      name: Puissance max du foyer (W)
      description: IL s'agit ici d'une consigne de consommation maximale a ne pas depasse en mode force, afin d'eviter de disjoncter lorsque d'autre gros consommateur sont en fonction (couplage AC). donc a adapter en fonction de votre abonnement Enedis. Par exemple une approximation, 12KVA -> 12000.
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: W

    
    delay_force:
      name: Temporisation régulation mode force
      description: il s'agit du delay de temporisatin avant d'effectuer cetaines actions.
      default: 10
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: "s"

mode: restart

trigger:
  - platform: state
    entity_id: !input net_consumption
  - platform: state
    entity_id: !input tesla_switch
  - platform: state
    entity_id: !input charge_mode
  - platform: time_pattern
    minutes: "/5"

variables:
  net_entity: !input net_consumption
  switch_entity: !input tesla_switch
  amp_entity: !input tesla_amperage
  soc_entity: !input tesla_soc
  mode_entity: !input charge_mode

  mode: "{{ states(mode_entity) | string }}"
  net: "{{ states(net_entity) | float }}"
  soc: "{{ states(soc_entity) | float }}"

  min_power: 1100
  max_house: !input max_house_power

  available_power: "{{ -net }}"

  computed_amps: >-
    {% set watts = available_power %}
    {% set amp = watts / (min_power / 5) %}
    {% if amp < 5 %}
      0
    {% elif amp > 32 %}
      32
    {% else %}
      {{ amp | round(0) }}
    {% endif %}

  smart_threshold: "{{ -(min_power * (soc / 100)) }}"

action:

  # MODE MANUEL
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manuel' }}"
        sequence:
          - stop: "Mode manuel actif – aucune automatisation"

  # MODE RADIN
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'radin' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= -min_power }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: 5
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # MODE SMART SOLAIRE
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'smart_solaire' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= smart_threshold and computed_amps >= 5 }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: "{{ computed_amps }}"
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # MODE FORCE
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'force' }}"
        sequence:
          # 1. Sécurité SOC 100%
          - if:
              - condition: numeric_state
                entity_id: !input tesla_soc
                above: 99.9
            then:
              - service: switch.turn_off
                target:
                  entity_id: !input tesla_switch

          # 2. Allumage si nécessaire
          - if:
              - condition: state
                entity_id: !input tesla_switch
                state: "off"
            then:
              - service: switch.turn_on
                target:
                  entity_id: !input tesla_switch

          # 3. Régulation de l'intensité (±1A)
          - service: number.set_value
            target:
              entity_id: !input tesla_amperage
            data:
              value: >-
                {% set current_amp = states(amp_entity) | int(5) %}
                {# On récupère la valeur de l'input amp_max #}
                {% set max_allowed = states(amp_max) | int(32) if states(amp_max) is defined else 32 %}
                
                {# Si on dépasse la puissance max de la maison, on baisse d'urgence #}
                {% if net > max_house %}
                  {{ [current_amp - 1, 5] | max }}
                
                {# Si on a de la marge, on monte jusqu'à la limite définie par l'utilisateur #}
                {% elif (max_house - net) > 1500 %}
                  {{ [current_amp + 1, max_allowed] | min }}
                
                {% else %}
                  {{ current_amp }}
                {% endif %}
