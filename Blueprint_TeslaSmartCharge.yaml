blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.7
  description: Optimise la charge selon les panneaux solaires et le mode choisi
  domain: automation

  input:

    tesla_switch:
      name: Switch de charge Tesla
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge (A)
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Pourcentage batterie Tesla (%)
      selector:
        entity:
          domain: sensor
          device_class: battery

    net_consumption:
      name: Consommation nette du foyer (W)
      selector:
        entity:
          domain: sensor
          device_class: power

    tesla_min_power:
      name: Puissance Tesla à 5A (W)
      default: 1100
      selector:
        number:
          min: 500
          max: 3000
          unit_of_measurement: "W"

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: "W"

    delay_off:
      name: Temps minimum ON avant OFF (s)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: "s"

    charge_mode:
      name: Mode de charge Tesla
      selector:
        entity:
          domain: select

mode: restart

trigger:
  # Mets bien le charge_mode dans les triggers pour qu’il réagisse aux changements aussi
  - platform: state
    entity_id: !input net_consumption

  - platform: state
    entity_id: !input tesla_switch

  - platform: state
    entity_id: !input charge_mode

  - platform: time_pattern
    minutes: "/5"
    id: periodic_check

variables:
  # Premièrement bind les inputs à des variables
  charge_mode_entity: !input charge_mode
  net_entity: !input net_consumption
  soc_entity: !input tesla_soc

  # Ensuite on peut utiliser ces variables dans les templates
  mode: "{{ states(charge_mode_entity) }}"
  net: "{{ states(net_entity) | float }}"
  soc: "{{ states(soc_entity) | float }}"
  min_power: !input tesla_min_power
  max_house: !input max_house_power
  switch_id: !input tesla_switch
  amp_entity: !input tesla_amperage

  # calculs
  available_power: "{{ 0 - net }}"
  computed_amps: >-
    {% set watts = available_power %}
    {% set amp = (watts / (min_power / 5)) | float %}
    {% if amp < 5 %} 0
    {% elif amp > 32 %} 32
    {% else %} {{ amp | round(0) }}
    {% endif %}

action:

  # ================================
  # MODE 1 — MANUEL => stop
  # ================================
  - if:
      - "{{ mode == 'manuel' }}"
    then:
      - stop: "Mode manuel actif – aucune automatisation"

  - choose:

      ###############################################
      # MODE RADIN
      ###############################################
      - conditions: "{{ mode == 'radin' }}"
        sequence:
          - if:
              - "{{ net <= (min_power * -1) }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 5
            else:
              - delay: "{{ delay_off }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE SMART SOLAIRE
      ###############################################
      - conditions: "{{ mode == 'smart_solaire' }}"
        sequence:
          - variables:
              smart_threshold: "{{ (min_power * (soc / 100)) * -1 }}"
          - if:
              - "{{ net <= smart_threshold }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - if:
                  - "{{ computed_amps >= 5 }}"
                then:
                  - service: number.set_value
                    target:
                      entity_id: "{{ amp_entity }}"
                    data:
                      value: "{{ computed_amps }}"
            else:
              - delay: "{{ delay_off }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE FORCE
      ###############################################
      - conditions: "{{ mode == 'force' }}"
        sequence:
          - if:
              - "{{ (net * -1) + min_power <= max_house }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 32
            else:
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"
