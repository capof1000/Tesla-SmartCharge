blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.6
  description: Optimise la charge selon les panneaux solaires et le mode choisi
  domain: automation

  input:

    tesla_switch:
      name: Switch de charge Tesla
      default: switch.tesla_charger
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge (A)
      default: number.tesla_charging_amps
      selector:
        entity:
          domain: number

    tesla_soc:
      name: Pourcentage batterie Tesla (%)
      default: sensor.tesla_charge_level
      selector:
        entity:
          domain: sensor
          device_class: battery

    net_consumption:
      name: Consommation nette du foyer (W)
      default: sensor.consommation_nette_w
      selector:
        entity:
          domain: sensor
          device_class: power

    tesla_min_power:
      name: Puissance Tesla à 5A (W)
      default: 1100
      selector:
        number:
          min: 500
          max: 3000
          unit_of_measurement: "W"

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: "W"

    delay_off:
      name: Temps minimum ON avant OFF (s)
      default: 120
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: "s"

    charge_mode:
      name: Mode de charge Tesla
      default: select.tesla_mode_charge_tesla
      selector:
        entity:
          domain: select

mode: restart

trigger:
  # Surproduction + conditions selon mode
  - platform: state
    entity_id: !input net_consumption

  # Sécurité disjoncteur
  - platform: state
    entity_id: !input tesla_switch

  # Vérification périodique
  - platform: time_pattern
    minutes: "/5"

  # Changement de mode de charge
  - platform: state
    entity_id: !input charge_mode

variables:
  switch_id: !input tesla_switch
  amp_entity: !input tesla_amperage
  min_power: !input tesla_min_power
  max_house: !input max_house_power
  delay_off_val: !input delay_off

action:
  - variables:
      mode: "{{ states(input.charge_mode) }}"
      net: "{{ states(input.net_consumption) | float }}"
      soc: "{{ states(input.tesla_soc) | float }}"
      available_power: "{{ 0 - net }}"
      computed_amps: >-
        {% set watts = 0 - net %}
        {% set amp = (watts / (min_power/5)) | float %}
        {% if amp < 5 %} 0
        {% elif amp > 32 %} 32
        {% else %} {{ amp | round(0) }}
        {% endif %}

  # ================================
  # BLINDAGE MODE MANUEL
  # ================================
  - if:
      - condition: template
        value_template: "{{ mode == 'manuel' }}"
    then:
      - stop: "Mode manuel actif – aucune automatisation"

  # ================================
  # AUTOMATISATIONS DES AUTRES MODES
  # ================================
  - choose:

      ###############################################
      # MODE RADIN
      ###############################################
      - conditions: "{{ mode == 'radin' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ net <= (min_power * -1) }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 5
            else:
              - delay: "{{ delay_off_val }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE SMART SOLAIRE
      ###############################################
      - conditions: "{{ mode == 'smart_solaire' }}"
        sequence:
          - variables:
              smart_threshold: "{{ (min_power * (soc/100)) * -1 }}"
          - if:
              - condition: template
                value_template: "{{ net <= smart_threshold }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - if:
                  - condition: template
                    value_template: "{{ computed_amps >= 5 }}"
                then:
                  - service: number.set_value
                    target:
                      entity_id: "{{ amp_entity }}"
                    data:
                      value: "{{ computed_amps }}"
            else:
              - delay: "{{ delay_off_val }}"
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"

      ###############################################
      # MODE FORCE
      ###############################################
      - conditions: "{{ mode == 'force' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ (net * -1) + min_power <= max_house }}"
            then:
              - service: switch.turn_on
                target:
                  entity_id: "{{ switch_id }}"
              - service: number.set_value
                target:
                  entity_id: "{{ amp_entity }}"
                data:
                  value: 32
            else:
              - service: switch.turn_off
                target:
                  entity_id: "{{ switch_id }}"
