blueprint:
  name: Optimisation Charge Tesla Photovoltaïque v0.0.6
  description: >
    Ajuste dynamiquement l’intensité de charge du véhicule en mode forcé
    selon la consommation nette du foyer et le SOC batterie.
  domain: automation

  input:
    mode_force:
      name: Mode forcé
      selector:
        entity:
          domain: input_boolean

    charging_switch:
      name: Interrupteur de charge
      selector:
        entity:
          domain: switch

    charging_amp_number:
      name: Intensité de charge (A)
      selector:
        entity:
          domain: number

    conso_nette:
      name: Consommation nette du foyer (W)
      selector:
        entity:
          domain: sensor

    soc_batterie:
      name: SOC batterie (%)
      selector:
        entity:
          domain: sensor

    puissance_max_foyer:
      name: Puissance max du foyer (W)
      selector:
        entity:
          domain: number

    delay:
      name: Temporisation entre ajustements
      description: Evite les variations trop rapides
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: "s"

    amp_min:
      name: Intensité de charge mini
      default: 5
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"

    amp_max:
      name: Intensité de charge max
      default: 32
      selector:
        number:
          min: 5
          max: 32
          unit_of_measurement: "A"

mode: restart

trigger:
  - platform: time_pattern
    seconds: "/10"

variables:
  current_amp: "{{ states(input.charging_amp_number) | int }}"
  conso: "{{ states(input.conso_nette) | int }}"
  soc: "{{ states(input.soc_batterie) | int }}"
  pmax: "{{ states(input.puissance_max_foyer) | int }}"
  amp_min: "{{ input.amp_min | int }}"
  amp_max: "{{ input.amp_max | int }}"

condition:
  - condition: state
    entity_id: !input mode_force
    state: "on"

action:
  - choose:

      # 🔽 Diminuer l’intensité
      - conditions:
          - condition: template
            value_template: >
              {{ conso > pmax and soc > 5 and current_amp > amp_min }}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input charging_amp_number
            data:
              value: "{{ current_amp - 1 }}"
          - delay:
              seconds: !input delay

      # 🔼 Augmenter l’intensité
      - conditions:
          - condition: template
            value_template: >
              {{ conso < pmax and soc < 32 and current_amp < amp_max }}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input charging_amp_number
            data:
              value: "{{ current_amp + 1 }}"
          - delay:
              seconds: !input delay

    default: []

