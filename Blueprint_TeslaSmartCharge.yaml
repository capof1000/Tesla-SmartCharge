blueprint:
  name: Optimisation Charge Tesla Photovoltaïque
  description: Reproduction fidèle de l’automatisation v0.0.4
  domain: automation

  input:
    net_consumption:
      name: Consommation nette du foyer (W)
      selector:
        entity:
          domain: sensor

    tesla_switch:
      name: Switch charge Tesla
      selector:
        entity:
          domain: switch

    tesla_amperage:
      name: Intensité de charge Tesla
      selector:
        entity:
          domain: number

    tesla_soc:
      name: SOC batterie Tesla
      selector:
        entity:
          domain: sensor

    charge_mode:
      name: Mode de charge Tesla
      selector:
        entity:
          domain: select

    max_house_power:
      name: Puissance max du foyer (W)
      default: 12000
      selector:
        number:
          min: 3000
          max: 36000
          unit_of_measurement: W

mode: restart

trigger:
  - platform: state
    entity_id: !input net_consumption
  - platform: state
    entity_id: !input tesla_switch
  - platform: state
    entity_id: !input charge_mode
  - platform: time_pattern
    minutes: "/5"

variables:
  # entités issues des inputs
  net_entity: !input net_consumption
  switch_entity: !input tesla_switch
  amp_entity: !input tesla_amperage
  soc_entity: !input tesla_soc
  mode_entity: !input charge_mode

  # valeurs calculées (IDENTIQUES à ton automation)
  mode: "{{ states(mode_entity) | string }}"
  net: "{{ states(net_entity) | float }}"
  soc: "{{ states(soc_entity) | float }}"

  min_power: 1100
  max_house: !input max_house_power

  available_power: "{{ -net }}"

  computed_amps: >-
    {% set watts = available_power %}
    {% set amp = watts / (min_power / 5) %}
    {% if amp < 5 %}
      0
    {% elif amp > 32 %}
      32
    {% else %}
      {{ amp | round(0) }}
    {% endif %}

  smart_threshold: "{{ -(min_power * (soc / 100)) }}"

action:

  # ================================
  # MODE MANUEL
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'manuel' }}"
        sequence:
          - stop: "Mode manuel actif – aucune automatisation"

  # ================================
  # MODE RADIN
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'radin' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= -min_power }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: 5
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # ================================
  # MODE SMART SOLAIRE
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'smart_solaire' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ net <= smart_threshold and computed_amps >= 5 }}"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: "{{ computed_amps }}"
          - delay: 120
          - service: switch.turn_off
            target:
              entity_id: !input tesla_switch

  # ================================
  # MODE FORCE
  # ================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ mode == 'force' }}"
        sequence:

          # SOC = 100% → arrêt
          - choose:
              - conditions:
                  - condition: numeric_state
                    entity_id: !input tesla_soc
                    above: 99.9
                sequence:
                  - service: switch.turn_off
                    target:
                      entity_id: !input tesla_switch

          # voiture éteinte → démarrage sans changer l’intensité
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "off"
                sequence:
                  - service: switch.turn_on
                    target:
                      entity_id: !input tesla_switch

          # voiture déjà en charge → ajustement ±1A
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input tesla_switch
                    state: "on"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input tesla_amperage
                    data:
                      value: >-
                        {% set current_amp = states(amp_entity) | int %}
                        {% if net > max_house and soc > 5 %}
                          {{ current_amp - 1 }}
                        {% elif net < max_house and soc < 32 %}
                          {{ current_amp + 1 }}
                        {% else %}
                          {{ current_amp }}
                        {% endif %}
